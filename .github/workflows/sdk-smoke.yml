name: sdk-smoke

# Fresh-installs the QVAC JS and Python SDKs from npm/PyPI and round-trips a
# heartbeat through the real worker. Runs weekly, because a dependency release
# can break an SDK version that has not changed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated SDK versions ('latest' resolves from npm)"
        default: "latest"

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make setup
      - name: Smoke test
        run: .venv/bin/python -m qvac_bench.cli smoke --versions "${{ inputs.versions || 'latest' }}" --fail-on-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-smoke-${{ matrix.os }}
          path: results/sdk-smoke/
